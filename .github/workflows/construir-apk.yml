name: Construir APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Permiso de cámara (escáner de códigos)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Ícono de la app
        continue-on-error: true
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp resources/icon-maskable-512.png android/app/src/main/res/mipmap-$d/$n.png
            done
          done
          mkdir -p android/app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0F766E</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml

      - name: Copiar la app al proyecto
        run: npx cap sync android

      - name: Construir el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk caja-miscelanea.apk

      - uses: actions/upload-artifact@v4
        with:
          name: caja-miscelanea-apk
          path: caja-miscelanea.apk
